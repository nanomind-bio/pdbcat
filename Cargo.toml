[package]
name = "pdbcat"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "Terminal-based PDB/mmCIF molecular structure viewer"
license = "MIT"
authors = ["Andres Torrubia <info@nanomind.bio>"]
repository = "https://github.com/nanomind-bio/pdbcat"
homepage = "https://github.com/nanomind-bio/pdbcat"
keywords = ["pdb", "molecular", "viewer", "terminal", "protein"]
categories = ["command-line-utilities", "science", "visualization"]
exclude = ["assets/", ".github/"]

[dependencies]
# Terminal UI
crossterm = "0.27"
ratatui = "0.26"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Linear algebra for 3D transforms
nalgebra = "0.32"

# Error handling
thiserror = "1"

# Compression for PNG encoding
flate2 = "1"

# Parallel processing
rayon = "1.10"

[dev-dependencies]
# Testing

[profile.release]
lto = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
