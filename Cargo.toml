[package]
name = "pdbcat"
version = "0.1.0"
edition = "2021"
description = "Terminal-based PDB/mmCIF molecular structure viewer"
license = "MIT"
authors = []

[dependencies]
# Terminal UI
crossterm = "0.27"
ratatui = "0.26"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Linear algebra for 3D transforms
nalgebra = "0.32"

# Error handling
thiserror = "1"

# Compression for PNG encoding
flate2 = "1"

# Parallel processing
rayon = "1.10"

[dev-dependencies]
# Testing

[profile.release]
lto = true
opt-level = 3
